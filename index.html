<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norsk A1 — Интерактивный тренажер</title>
  <style>
    :root {
      --primary: #00205B;
      --secondary: #BA0C2F;
      --bg: #F4F6F9;
      --card-bg: #FFFFFF;
      --text: #2D3748;
      --success: #28A745;
      --danger: #DC3545;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 5px;
      font-size: 1.8rem;
    }

    p.subtitle {
      color: #666;
      margin-top: 0;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      padding: 8px 16px;
      border: none;
      background-color: #E2E8F0;
      color: var(--text);
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: white;
    }

    .section {
      display: none;
      width: 100%;
      max-width: 650px;
    }

    .section.active {
      display: block;
    }

    /* FLASHCARDS */
    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 220px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 15px;
      background: var(--card-bg);
      padding: 20px;
      box-sizing: border-box;
    }

    .card-front {
      border-top: 6px solid var(--primary);
    }

    .card-back {
      background-color: #F0F4FF;
      transform: rotateY(180deg);
      border-top: 6px solid var(--secondary);
    }

    .word {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 10px;
      text-align: center;
    }

    .translation {
      font-size: 1.5rem;
      color: var(--secondary);
      text-align: center;
    }

    .hint {
      font-size: 0.85rem;
      color: #888;
      position: absolute;
      bottom: 15px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn:hover { opacity: 0.9; }

    /* QUIZ */
    .quiz-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .option-btn {
      padding: 12px;
      border: 2px solid #E2E8F0;
      background: white;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn.correct {
      background-color: var(--success);
      color: white;
      border-color: var(--success);
    }

    .option-btn.wrong {
      background-color: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    /* DICTIONARY & ALPHABET */
    .search-box {
      width: 100%;
      padding: 12px;
      border: 2px solid #CBD5E0;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 15px;
    }

    .dict-list {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      max-height: 400px;
      overflow-y: auto;
    }

    .dict-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid #E2E8F0;
    }

    .dict-item:last-child { border-bottom: none; }

    .norwegian-word {
      font-weight: bold;
      color: var(--primary);
    }

    /* ALPHABET GRID */
    .alphabet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .letter-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-top: 4px solid var(--primary);
    }

    .letter-card.special {
      border-top: 4px solid var(--secondary);
      background: #FFF5F5;
    }

    .letter-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
    }

    .letter-card.special .letter-title {
      color: var(--secondary);
    }

    .letter-sound {
      font-size: 0.95rem;
      font-color: #555;
      font-weight: 600;
      margin: 5px 0;
    }

    .letter-example {
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <h1>Norsk A1 — Тренажёр</h1>
    <p class="subtitle">Алфавит, карточки, тест и словарь</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('alphabet', event)">Алфавит</button>
    <button class="tab-btn" onclick="switchTab('cards', event)">Карточки</button>
    <button class="tab-btn" onclick="switchTab('quiz', event)">Тест</button>
    <button class="tab-btn" onclick="switchTab('dict', event)">Словарь</button>
  </div>

  <!-- SECTION: ALPHABET -->
  <div id="alphabet" class="section active">
    <div class="alphabet-grid" id="alphabet-grid"></div>
  </div>

  <!-- SECTION: FLASHCARDS -->
  <div id="cards" class="section">
    <div class="card-container" onclick="flipCard()">
      <div class="card" id="card">
        <div class="card-front">
          <div class="word" id="card-norwegian">...</div>
          <div class="hint">Нажмите, чтобы перевернуть</div>
        </div>
        <div class="card-back">
          <div class="translation" id="card-russian">...</div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" onclick="prevCard()">Назад</button>
      <span id="card-progress" style="align-self: center; font-weight: bold;">1 / 0</span>
      <button class="btn" onclick="nextCard()">Вперёд</button>
    </div>
  </div>

  <!-- SECTION: QUIZ -->
  <div id="quiz" class="section">
    <div class="quiz-card">
      <h3 id="quiz-question" style="text-align: center;">Как переводится слово?</h3>
      <div class="options-grid" id="options"></div>
      <div style="margin-top: 15px; text-align: right; font-weight: bold;" id="quiz-score">Счёт: 0</div>
    </div>
  </div>

  <!-- SECTION: DICTIONARY -->
  <div id="dict" class="section">
    <input type="text" class="search-box" id="search" placeholder="Поиск слова..." oninput="filterDict()">
    <div class="dict-list" id="dict-list"></div>
  </div>

  <script>
    const alphabet = [
      { l: "A a", s: "[ а ]", e: "Ja (да)" },
      { l: "B b", s: "[ бэ ]", e: "Bra (хорошо)" },
      { l: "C c", s: "[ сэ ]", e: "Camping" },
      { l: "D d", s: "[ дэ ]", e: "Dag (день)" },
      { l: "E e", s: "[ э ]", e: "Er (есть)" },
      { l: "F f", s: "[ эф ]", e: "Fra (из/от)" },
      { l: "G g", s: "[ гэ ]", e: "God (хороший)" },
      { l: "H h", s: "[ го ]", e: "Hei (привет)" },
      { l: "I i", s: "[ и ]", e: "I (в)" },
      { l: "J j", s: "[ йот ]", e: "Jeg (я)" },
      { l: "K k", s: "[ ка ]", e: "Kveld (вечер)" },
      { l: "L l", s: "[ эл ]", e: "Lære (учить)" },
      { l: "M m", s: "[ ем ]", e: "Morgen (утро)" },
      { l: "N n", s: "[ эн ]", e: "Nei (нет)" },
      { l: "O o", s: "[ у ]", e: "Og (и)" },
      { l: "P p", s: "[ пэ ]", e: "Pappa (папа)" },
      { l: "Q q", s: "[ ку ]", e: "Riders" },
      { l: "R r", s: "[ эр ]", e: "Rød (красный)" },
      { l: "S s", s: "[ эс ]", e: "Se (смотреть)" },
      { l: "T t", s: "[ тэ ]", e: "Takk (спасибо)" },
      { l: "U u", s: "[ ю-у ]", e: "Ung (молодой)" },
      { l: "V v", s: "[ вэ ]", e: "Vi (мы)" },
      { l: "W w", s: "[ добл-вэ ]", e: "Web" },
      { l: "X x", s: "[ экс ]", e: "Taxi" },
      { l: "Y y", s: "[ и (округленная) ]", e: "Lytte (слушать)" },
      { l: "Z z", s: "[ зет ]", e: "Zebra" },
      { l: "Æ æ", s: "[ э (широкая) ]", e: "Lære (учиться)", spec: true },
      { l: "Ø ø", s: "[ ё (губы в о) ]", e: "Øl (пиво)", spec: true },
      { l: "Å å", s: "[ о ]", e: "Å gå (идти)", spec: true }
    ];

    const vocabulary = [
      { no: "Hei / Hallo", ru: "Привет" },
      { no: "God morgen", ru: "Доброе утро" },
      { no: "God dag", ru: "Добрый день" },
      { no: "God kveld", ru: "Добрый вечер" },
      { no: "Ha det bra", ru: "До свидания" },
      { no: "Vi ses", ru: "Увидимся" },
      { no: "Takk", ru: "Спасибо" },
      { no: "Tusen takk", ru: "Большое спасибо" },
      { no: "Vær så god", ru: "Пожалуйста" },
      { no: "Unskyld", ru: "Извините" },
      { no: "Ja", ru: "Да" },
      { no: "Nei", ru: "Нет" },
      { no: "Hva heter du?", ru: "Как тебя зовут?" },
      { no: "Jeg heter...", ru: "Меня зовут..." },
      { no: "Hvordan går det?", ru: "Как дела?" },
      { no: "Bare bra, takk", ru: "Отлично, спасибо" },
      { no: "Hvor kommer du fra?", ru: "Откуда ты?" },
      { no: "Snakker du norsk?", ru: "Ты говоришь по-норвежски?" },
      { no: "Jeg snakker litt norsk", ru: "Я немного говорю по-норвежски" },
      { no: "Jeg", ru: "Я" },
      { no: "Du", ru: "Ты" },
      { no: "Han", ru: "Он" },
      { no: "Hun", ru: "Она" },
      { no: "Vi", ru: "Мы" },
      { no: "Dere", ru: "Вы (множ.)" },
      { no: "De", ru: "Они" },
      { no: "Å være (er)", ru: "Быть (есть)" },
      { no: "Å ha (har)", ru: "Иметь (есть у)" },
      { no: "Å snakke (snakker)", ru: "Говорить" },
      { no: "Å bo (bor)", ru: "Жить" },
      { no: "Å lære (lærer)", ru: "Учить / учиться" },
      { no: "Å spise (spiser)", ru: "Есть" },
      { no: "Å drikke (drikker)", ru: "Пить" },
      { no: "Å gå (går)", ru: "Идти / ходить" },
      { no: "Å komme (kommer)", ru: "Приходить" },
      { no: "Å forstå (forstår)", ru: "Понимать" },
      { no: "mandag", ru: "понедельник" },
      { no: "tirsdag", ru: "вторник" },
      { no: "onsdag", ru: "среда" },
      { no: "torsdag", ru: "четверг" },
      { no: "fredag", ru: "пятница" },
      { no: "lørdag", ru: "суббота" },
      { no: "søndag", ru: "воскресенье" },
      { no: "en / et (1)", ru: "один" },
      { no: "to (2)", ru: "два" },
      { no: "tre (3)", ru: "три" },
      { no: "fire (4)", ru: "четыре" },
      { no: "fem (5)", ru: "пять" },
      { no: "seks (6)", ru: "шесть" },
      { no: "sju / syv (7)", ru: "семь" },
      { no: "åtte (8)", ru: "восемь" },
      { no: "ni (9)", ru: "девять" },
      { no: "ti (10)", ru: "десять" }
    ];

    let currentCardIndex = 0;
    let quizScore = 0;
    let currentQuizWord = null;

    // RENDER ALPHABET
    function renderAlphabet() {
      const grid = document.getElementById('alphabet-grid');
      grid.innerHTML = '';
      alphabet.forEach(item => {
        const card = document.createElement('div');
        card.className = `letter-card ${item.spec ? 'special' : ''}`;
        card.innerHTML = `
          <div class="letter-title">${item.l}</div>
          <div class="letter-sound">${item.s}</div>
          <div class="letter-example">${item.e}</div>
        `;
        grid.appendChild(card);
      });
    }

    // TAB SWITCHING
    function switchTab(tabId, event) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      if (event) event.target.classList.add('active');

      if (tabId === 'quiz') startQuiz();
    }

    // FLASHCARDS
    function updateCard() {
      const cardEl = document.getElementById('card');
      cardEl.classList.remove('flipped');
      setTimeout(() => {
        document.getElementById('card-norwegian').innerText = vocabulary[currentCardIndex].no;
        document.getElementById('card-russian').innerText = vocabulary[currentCardIndex].ru;
        document.getElementById('card-progress').innerText = `${currentCardIndex + 1} / ${vocabulary.length}`;
      }, 150);
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function nextCard() {
      currentCardIndex = (currentCardIndex + 1) % vocabulary.length;
      updateCard();
    }

    function prevCard() {
      currentCardIndex = (currentCardIndex - 1 + vocabulary.length) % vocabulary.length;
      updateCard();
    }

    // QUIZ
    function startQuiz() {
      const randomIndex = Math.floor(Math.random() * vocabulary.length);
      currentQuizWord = vocabulary[randomIndex];

      document.getElementById('quiz-question').innerText = `Как переводится: "${currentQuizWord.no}"?`;

      let options = [currentQuizWord.ru];
      while (options.length < 4) {
        let randRu = vocabulary[Math.floor(Math.random() * vocabulary.length)].ru;
        if (!options.includes(randRu)) options.push(randRu);
      }
      options.sort(() => Math.random() - 0.5);

      const optionsGrid = document.getElementById('options');
      optionsGrid.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, opt);
        optionsGrid.appendChild(btn);
      });
    }

    function checkAnswer(btn, answer) {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);

      if (answer === currentQuizWord.ru) {
        btn.classList.add('correct');
        quizScore++;
        document.getElementById('quiz-score').innerText = `Счёт: ${quizScore}`;
      } else {
        btn.classList.add('wrong');
      }

      setTimeout(startQuiz, 1200);
    }

    // DICTIONARY
    function renderDict(filter = '') {
      const list = document.getElementById('dict-list');
      list.innerHTML = '';
      vocabulary
        .filter(item => item.no.toLowerCase().includes(filter.toLowerCase()) || item.ru.toLowerCase().includes(filter.toLowerCase()))
        .forEach(item => {
          const row = document.createElement('div');
          row.className = 'dict-item';
          row.innerHTML = `<span class="norwegian-word">${item.no}</span><span>${item.ru}</span>`;
          list.appendChild(row);
        });
    }

    function filterDict() {
      const query = document.getElementById('search').value;
      renderDict(query);
    }

    // INIT
    renderAlphabet();
    updateCard();
    renderDict();
  </script>
</body>
</html>
